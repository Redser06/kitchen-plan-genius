name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Active LTS (Node 24 Krypton). checkout/setup-node v4 ran on Node 20,
          # which GitHub no longer provides for JavaScript actions.
          node-version: 24

      - name: Install Bun
        run: npm install -g bun@1.4.3

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bunx tsc --noEmit

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Test
        if: ${{ !cancelled() }}
        run: bun run test

      - name: Build
        if: ${{ !cancelled() }}
        run: bun run build
