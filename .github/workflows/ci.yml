name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        run: npm install -g bun@1.4.3

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bunx tsc --noEmit

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Test
        if: ${{ !cancelled() }}
        run: bun run test

      - name: Build
        if: ${{ !cancelled() }}
        run: bun run build
